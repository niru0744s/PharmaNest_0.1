services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pharmanest-backend:latest
    container_name: pharmanest-backend
    restart: always
    # Bound to localhost only -- Nginx is the only thing that should reach it directly
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 5000) + '/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s